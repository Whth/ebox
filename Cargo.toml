[package]
name = "ebox"
version = "0.3.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.52", features = ["derive", "env", "string", "unicode"] }
chrono = "0.4.42"
walkdir = "2.5.0"
rayon = "1.11.0"
tokio = { version = "1.48.0", features = ["full"] }
futures = "0.3.31"
async-openai = { version = "0.30.1", features = ["native-tls", "realtime"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
shellexpand = "3.1.1"
prettytable = "0.10.0"
strsim = "0.11.1"
dialoguer = "0.12.0"
fs_extra = "1.3.0"
humansize = "2.1.3"
regex = "1.12.2"
glob = "0.3.3"
dirs = "6.0.0"
log = "0.4.28"
csv = "1.4.0"
num_cpus = "1.17.0"
rand = "0.9.2"
reqwest = { version = "0.12.24", features = ["blocking"] }
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.8"
colored = "3.0.0"
indicatif = { version = "0.18.3", features = ["rayon"] }
anyhow = "1.0.100"
toml_edit = "0.23.7"
semver = { version = "1.0.27", features = ["serde"] }
git2 = "0.20.2"
md5 = "0.7"

ffmpeg-next = { version = "8.0.0", features = ["static"], optional = true }
kmeans = { version = "2.0.1", optional = true }
polars = { version = "0.51.0", features = ["csv", "dtype-categorical", "lazy", "ndarray"], optional = true }
mslnk = { version = "0.1.8", optional = true }
docx-rs = { version = "0.4.18", optional = true }
image = { version = "0.25.9", optional = true }
hound = { version = "3.5.1", optional = true }
netcdf = { version = "0.11.1", features = ["static"], optional = true }
ndarray = { version = "0.16.1", features = ["rayon"], optional = true }
foxil = { path = "src/bin/ffoil/foxil", optional = true }

[features]
default = ["basic"]
basic = ["ag", "mf", "sz", "am", "avd", "renm", "xect", "fof"]
video = ["vmd", "pmov", "sufk", "avd", "cdd", "vlc", "bpdf", "mpr"]

ag = []
mf = []
sz = []
am = []
pmov = []
sufk = []
rstrip = []
wprune = []
pdfp = []
onize = []
rpl = []
facm = []
arep = []
avd = []
cdd = []
vlc = []
reduce = []
pam = []
xect = []
cpr = []
bpdf = []
mpr = []
recmd = []
renm = []
hive = []
corda = []
ciklen = []
adconv = []
thernam = []
verbu = []

vmd = ["ffmpeg-next/static", "image", "hound"]
makwei = ["kmeans", "polars", "ndarray"]
fof = ["polars"]
startups = ["mslnk"]
bdocx = ["docx-rs"]
pls = ["image"]
pps = ["image"]
aupr = ["hound"]
nccsv = ["netcdf"]
fffoil = ["foxil"]

[workspace]
package = { }

[[bin]]
name = "vmd"
path = "src/bin/vmd.rs"
required-features = ["vmd"]

[[bin]]
name = "ag"
path = "src/bin/ag.rs"
required-features = ["ag"]

